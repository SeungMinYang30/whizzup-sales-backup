name: Bootstrap WHIZZUP source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand source archive
        run: |
          unzip -o whizzup-vercel-source.zip -d .
          rm whizzup-vercel-source.zip

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap WHIZZUP Vercel source"
          git push
